args:
  %{ for arg in args }
- "${arg}"
  %{ endfor }

  %{ if aws_iam_role_arn != "" || service_account_name != "" }
serviceAccount:
  create: true
  automount: true
  %{ if service_account_name != "" }
  name: "${service_account_name}"
  %{ endif }
  %{ if aws_iam_role_arn != "" }
  annotations:
    eks.amazonaws.com/role-arn: "${aws_iam_role_arn}"
  %{ endif }
%{ if azure_sa_client_id != "" ~}
  annotations:
    azure.workload.identity/client-id: "${azure_sa_client_id}"
%{ endif ~}
  %{ endif }

%{ if length(pod_labels) > 0 ~}
podLabels:
  ${indent(2, yamlencode(pod_labels))}
%{ endif ~}
configuration:
  values:
  %{ for key, value in config_values }
    ${key}: ${jsonencode(value)}
  %{ endfor }

image:
  tag: "${image_tag}"
  %{ if image_repository != "" }
  repository: "${image_repository}"
  %{ endif }

%{ if image_pull_secret_name != "" ~}
imagePullSecret:
  create: false
  name: "${image_pull_secret_name}"

%{ endif ~}
  %{ if length(init_scripts) > 0 }
initScripts:
  %{ for script in init_scripts }
- "${script}"
  %{ endfor }
  %{ endif }

%{ if worker_orchestrator ~}
worker:
  ${indent(2, yamlencode(worker))}
%{ endif ~}

%{ if liveness_probe != null ~}
livenessProbe:
  ${indent(2, yamlencode(liveness_probe))}
%{ endif ~}
%{ if readiness_probe != null ~}
readinessProbe:
  ${indent(2, yamlencode(readiness_probe))}
%{ endif ~}
%{ if startup_probe != null ~}
startupProbe:
  ${indent(2, yamlencode(startup_probe))}
%{ endif ~}
%{ if length(pod_annotations) > 0 ~}
podAnnotations:
  ${indent(2, yamlencode(pod_annotations))}
%{ endif ~}
%{ if termination_grace != null ~}
terminationGracePeriodSeconds: ${termination_grace}
%{ endif ~}
%{ if shutdown_drain_timeout != null ~}
shutdownDrainTimeoutSeconds: ${shutdown_drain_timeout}
%{ endif ~}
%{ if pod_disruption_budget != null ~}
podDisruptionBudget:
  ${indent(2, yamlencode(pod_disruption_budget))}
%{ endif ~}
%{ if length(node_selector) > 0 ~}
nodeSelector:
  ${indent(2, yamlencode(node_selector))}
%{ endif ~}
%{ if tolerations != null ~}
tolerations:
  ${indent(2, yamlencode(tolerations))}
%{ endif ~}
%{ if length(resources) > 0 ~}
resources:
  ${indent(2, yamlencode(resources))}
%{ endif ~}
%{ if replicas != null ~}
replicaCount: ${replicas}
%{ endif ~}
%{ if affinity != null ~}
affinity:
  ${indent(2, yamlencode(affinity))}
%{ endif ~}

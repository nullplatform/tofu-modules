args:
  %{ for arg in args }
- "${arg}"
  %{ endfor }

  %{ if aws_iam_role_arn != "" || azure_workload_identity_client_id != "" || service_account_name != "" }
serviceAccount:
  create: true
  automount: true
  %{ if service_account_name != "" }
  name: "${service_account_name}"
  %{ endif }
  %{ if aws_iam_role_arn != "" }
  annotations:
    eks.amazonaws.com/role-arn: "${aws_iam_role_arn}"
  %{ endif }
  %{ if azure_workload_identity_client_id != "" }
  annotations:
    "azure.workload.identity/client-id": "${azure_workload_identity_client_id}"
  %{ endif }
  %{ endif }

  %{ if azure_workload_identity_client_id != "" }
podLabels:
  "azure.workload.identity/use": "true"
  %{ endif }

configuration:
  values:
  %{ for key, value in config_values }
    ${key}: "${value}"
  %{ endfor }

image:
  tag: "${image_tag}"
  %{ if image_repository != "" }
  repository: "${image_repository}"
  %{ endif }

  %{ if length(init_scripts) > 0 }
initScripts:
  %{ for script in init_scripts }
- "${script}"
  %{ endfor }
  %{ endif }


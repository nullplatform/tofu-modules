args:
  %{ for arg in args }
- "${arg}"
  %{ endfor }

  %{ if aws_iam_role_arn != "" }
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: "${aws_iam_role_arn}"
  %{ endif }

  %{ if azure_workload_identity_active }
serviceAccount:
  annotations:
    azure.workload.identity/client-id: "${azure_client_id}"
podLabels:
  azure.workload.identity/use: "true"
  %{ endif }

configuration:
  values:
  %{ for key, value in config_values }
    ${key}: "${value}"
  %{ endfor }

image:
  tag: "${image_tag}"

  %{ if length(init_scripts) > 0 }
initScripts:
  %{ for script in init_scripts }
- "${script}"
  %{ endfor }
  %{ endif }

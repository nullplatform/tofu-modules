args:
  %{ for arg in args }
- "${arg}"
  %{ endfor }

  %{ if aws_iam_role_arn != "" || service_account_name != "" }
serviceAccount:
  create: true
  automount: true
  %{ if service_account_name != "" }
  name: "${service_account_name}"
  %{ endif }
  %{ if aws_iam_role_arn != "" }
  annotations:
    eks.amazonaws.com/role-arn: "${aws_iam_role_arn}"
  %{ endif }
  %{ endif }

configuration:
  values:
  %{ for key, value in config_values }
    ${key}: "${value}"
  %{ endfor }

image:
  tag: "${image_tag}"
  %{ if image_repository != "" }
  repository: "${image_repository}"
  %{ endif }

  %{ if length(init_scripts) > 0 }
initScripts:
  %{ for script in init_scripts }
- "${script}"
  %{ endfor }
  %{ endif }

  %{ if length(init_containers) > 0 }
initContainers:
${yamlencode(init_containers)}
  %{ endif }

  %{ if length(volumes) > 0 }
volumes:
${yamlencode(volumes)}
  %{ endif }

  %{ if length(volume_mounts) > 0 }
volumeMounts:
${yamlencode(volume_mounts)}
  %{ endif }


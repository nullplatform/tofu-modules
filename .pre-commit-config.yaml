repos:
- repo: https://github.com/gruntwork-io/pre-commit
  rev: v0.1.30
  hooks:
    - id: tofu-fmt
    - id: tofu-validate
      require_serial: true
      args:
        - --hook-config=--retry-once-with-cleanup=true
        - --tf-init-args=-backend=false
        - --tf-init-args=-lockfile=readonly
        - --args=-json
        - --args=-no-color
      exclude: '\.terraform/|\.terragrunt-cache/'

- repo: local
  hooks:
    - id: tofu-test
      name: tofu test
      entry: scripts/tofu-test.sh
      language: script
      files: '\.tf$|\.tftest\.hcl$'
      require_serial: true
      exclude: '\.terraform/|\.terragrunt-cache/'

    - id: check-version-pinning
      name: check version pinning
      entry: scripts/check-version-pinning.sh
      language: script
      files: '\.tf$'
      exclude: '\.terraform/|\.terragrunt-cache/'

    - id: block-superpowers-files
      name: block superpowers files
      entry: >-
        Superpowers artifacts (e.g. docs/superpowers/, specs, plans,
        brainstorms) must not be committed. Unstage them before committing.
      language: fail
      files: '(^|/)superpowers/'

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0  # Use the ref you want to point at
  hooks:
    -   id: trailing-whitespace
    -   id: detect-private-key

- repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
  rev: v9.18.0
  hooks:
    - id: commitlint
      stages: [commit-msg]
      additional_dependencies: ['@commitlint/config-conventional']
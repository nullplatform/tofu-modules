service:
  type: ${service_type}
%{ if cloud_provider == "oci" && length(oci_load_balancer_subnet_ids) > 0 ~}
  annotations:
    service.beta.kubernetes.io/oci-load-balancer-subnet1: "${join(",", oci_load_balancer_subnet_ids)}"
%{ endif ~}
  ports:
    - name: status-port
      port: ${status_port}
      targetPort: ${status_port}
       %{ if enable_http2 }
    - name: http2
      port: ${http2_port}
      protocol: TCP
      targetPort: ${http2_target_port}
       %{ endif }
    - name: https
      port: ${https_port}
      targetPort: ${https_target_port}

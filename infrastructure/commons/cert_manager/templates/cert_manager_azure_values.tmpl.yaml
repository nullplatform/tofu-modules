azure:
  subscriptionID: "${subscription_id}"
  resourceGroupName: "${resource_group_name}"
  clientID: "${client_id}"
  tenantID: "${tenant_id}"
  hostedZoneName: "${hosted_zone_name}"
  useWorkloadIdentity: ${use_workload_identity}
%{ if !use_workload_identity ~}
  clientSecret:
    secretName: "${client_secret_secret_name}"
%{ endif ~}

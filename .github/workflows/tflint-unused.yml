name: terraform-lint

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

jobs:
  check:
    name: Lint changed Terraform
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0

      - name: Find changed Terraform directories
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          dirs="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- '*.tf' | xargs -n1 dirname | sort -u || true)"
          {
            echo "dirs<<TFLINT_DIRS_EOF"
            echo "$dirs"
            echo "TFLINT_DIRS_EOF"
          } >> "$GITHUB_OUTPUT"

      # Same check, same scope (--only=terraform_unused_declarations) as the
      # local .husky/pre-commit hook — this is the CI backstop for anyone
      # who commits with --no-verify or doesn't have the hook installed.
      - name: Run tflint (unused declarations only)
        if: steps.changed.outputs.dirs != ''
        env:
          DIRS: ${{ steps.changed.outputs.dirs }}
        run: |
          failed=0
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            echo "::group::$dir"
            tflint --chdir="$dir" --config="$GITHUB_WORKSPACE/.tflint.hcl" --only=terraform_unused_declarations || failed=1
            echo "::endgroup::"
          done <<< "$DIRS"
          if [ "$failed" -eq 1 ]; then
            echo "::error::tflint found unused declarations in one or more changed modules (see groups above)."
            exit 1
          fi

      # CI backstop for the local pre-commit hook.
      - name: Check version pinning
        if: steps.changed.outputs.dirs != ''
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- '*.tf' || true)"
          [ -z "$files" ] && exit 0
          # shellcheck disable=SC2086
          ./scripts/check-version-pinning.sh $files

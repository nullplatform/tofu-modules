name: auto-merge-release-pr

on:
  pull_request:
    types: [opened, synchronize, labeled]

# The release workflow's generate-readmes job pushes an extra commit
# (regenerated READMEs) to the release PR branch shortly after it's opened
# (observed gap: ~38s on a real release). That push fires a new
# 'synchronize' event, starting a fresh run for this PR. Cancelling any
# still-running older run for the same PR ensures we never merge a stale
# commit that's missing the README update — the newest run always wins.
concurrency:
  group: auto-merge-release-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    uses: nullplatform/actions-nullplatform/.github/workflows/auto-merge-release.yml@main
    secrets:
      app-id: ${{ secrets.APP_RELEASE_ID }}
      app-private-key: ${{ secrets.APP_RELEASE_PRIVATE_KEY }}

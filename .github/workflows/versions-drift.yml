name: Versions Drift

# The versions in VERSIONS.md move upstream, not here, so this looks for newer
# releases on every pull request as well as on a schedule. The bump never lands
# on the contributor's branch: it goes to one dedicated pull request, updated in
# place, so an unrelated review never has to adjudicate a version bump.

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
  schedule:
    # Mondays 09:00 in GMT-3, which has no daylight saving, so 12:00 UTC all year.
    # GitHub can delay a scheduled run under load, so treat the day as the promise,
    # not the minute.
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: Report drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream versions
        id: check
        run: |
          # Exit 1 means drift or an unreadable row, which is a result. Anything
          # else means the check itself did not run, and must not pass silently.
          set +e
          ./scripts/check-versions-upstream.sh --markdown > report.md
          rc=$?
          set -e
          case "$rc" in
            0) echo "drift=0" >> "$GITHUB_OUTPUT" ;;
            1) echo "drift=1" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::check-versions-upstream.sh did not run (exit $rc)"; exit 1 ;;
          esac

      - name: Publish report
        run: |
          {
            echo '## Pinned versions vs upstream'
            echo
            cat report.md
            echo
            if [ "${{ steps.check.outputs.drift }}" = "1" ]; then
              echo 'Something is behind. The bump lands in its own pull request, not this one.'
            else
              echo 'Every pin is current.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  bump:
    name: Open bump pull request
    runs-on: ubuntu-latest
    # A fork pull request gets a read-only token, so it can report but not push.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: versions-bump
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # What has to come from main is the document being bumped, not the checker.
      # Running this ref's checker means a change to it is exercised by its own
      # pull request, and that this workflow works before it reaches main.
      - name: Take the checker aside and move to main
        run: |
          set -euo pipefail
          cp scripts/check-versions-upstream.sh /tmp/check-versions-upstream.sh
          git fetch --quiet origin main
          git switch --quiet -c chore/versions-bump origin/main

      - name: Apply bumps
        id: apply
        env:
          VERSIONS_DOC: VERSIONS.md
        run: |
          set +e
          /tmp/check-versions-upstream.sh --write > /dev/null
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "::error::check-versions-upstream.sh did not run (exit $rc)"
            exit 1
          fi
          if git diff --quiet -- VERSIONS.md; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            echo "changed=1" >> "$GITHUB_OUTPUT"
            /tmp/check-versions-upstream.sh --markdown > /tmp/report.md || true
          fi

      - name: Open or update the pull request
        if: steps.apply.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSIONS_DOC: VERSIONS.md
        run: |
          set -euo pipefail
          BRANCH=chore/versions-bump
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSIONS.md
          git commit -m 'chore(versions): bump documented versions to current upstream'
          git push -f origin "$BRANCH"

          {
            echo 'Upstream has newer releases than the versions documented in `VERSIONS.md`.'
            echo
            cat /tmp/report.md
            echo
            echo 'Merging is the deliberate decision the document asks for. Before merging:'
            echo
            echo '- Check the build dates, not the version numbers. A higher number can be an older build.'
            echo '- A row held back on purpose is reported as frozen and is not edited here.'
            echo '- These are the versions we recommend pinning, so a bump changes what customers copy.'
          } > /tmp/body.md

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title 'chore(versions): bump documented versions to current upstream' \
              --body-file /tmp/body.md
          else
            gh pr edit "$BRANCH" --body-file /tmp/body.md
          fi

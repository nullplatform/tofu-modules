name: Versions Drift

# The versions in VERSIONS.md move upstream, not here, so this looks for newer
# releases on every pull request as well as on a schedule. The bump never lands
# on the contributor's branch: it goes to one dedicated pull request, updated in
# place, so an unrelated review never has to adjudicate a version bump.

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: Report drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream versions
        id: check
        run: |
          ./scripts/check-versions-upstream.sh --markdown > report.md || echo "drift=1" >> "$GITHUB_OUTPUT"

      - name: Publish report
        run: |
          {
            echo '## Pinned versions vs upstream'
            echo
            cat report.md
            echo
            if [ "${{ steps.check.outputs.drift }}" = "1" ]; then
              echo 'Something is behind. The bump lands in its own pull request, not this one.'
            else
              echo 'Every pin is current.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  bump:
    name: Open bump pull request
    runs-on: ubuntu-latest
    # A fork pull request gets a read-only token, so it can report but not push.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: versions-bump
      cancel-in-progress: true
    steps:
      # Branch off main, never off the pull request: the bump has to stand alone.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply bumps
        id: apply
        run: |
          ./scripts/check-versions-upstream.sh --write > /dev/null || true
          if git diff --quiet -- VERSIONS.md; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            echo "changed=1" >> "$GITHUB_OUTPUT"
            ./scripts/check-versions-upstream.sh --markdown > /tmp/report.md || true
          fi

      - name: Open or update the pull request
        if: steps.apply.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH=chore/versions-bump
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add VERSIONS.md
          git commit -m 'chore(versions): bump documented versions to current upstream'
          git push -f origin "$BRANCH"

          {
            echo 'Upstream has newer releases than the versions documented in `VERSIONS.md`.'
            echo
            cat /tmp/report.md
            echo
            echo 'Merging is the deliberate decision the document asks for. Before merging:'
            echo
            echo '- Check the build dates, not the version numbers. A higher number can be an older build.'
            echo '- A row held back on purpose is reported as frozen and is not edited here.'
            echo '- These are the versions we recommend pinning, so a bump changes what customers copy.'
          } > /tmp/body.md

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title 'chore(versions): bump documented versions to current upstream' \
              --body-file /tmp/body.md
          else
            gh pr edit "$BRANCH" --body-file /tmp/body.md
          fi

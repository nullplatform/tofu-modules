name: Release Please

on:
  push:
    branches:
      - main
      - 6.x

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    uses: nullplatform/actions-nullplatform/.github/workflows/release.yml@main
    permissions:
      contents: write
      pull-requests: write
    with:
      update_readme_versions: false

  generate-readmes:
    name: Generate READMEs for Release PR
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check if Release Please PR exists
        id: check_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=$(gh pr list \
            --repo ${{ github.repository }} \
            --head release-please--branches--${{ github.ref_name }} \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -z "$PR_NUMBER" ]; then
            echo "No Release Please PR found. Skipping README generation."
            echo "pr_exists=false" >> $GITHUB_OUTPUT
          else
            echo "Found Release Please PR #$PR_NUMBER"
            echo "pr_exists=true" >> $GITHUB_OUTPUT
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Release PR branch
        if: steps.check_pr.outputs.pr_exists == 'true'
        uses: actions/checkout@v6
        with:
          ref: release-please--branches--${{ github.ref_name }}
          fetch-depth: 0

      - name: Detect changed modules
        if: steps.check_pr.outputs.pr_exists == 'true'
        id: changed
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "No previous tag found. Will regenerate all."
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "dirs=--all --base-dir ." >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED_DIRS=$(git diff --name-only --diff-filter=d "$LAST_TAG"..HEAD -- '*.tf' \
            | grep -v '\.terraform/' \
            | xargs -I{} dirname {} \
            | sort -u \
            | while read -r d; do [ -d "$d" ] && echo "$d"; done \
            | tr '\n' ' ')

          if [ -z "$CHANGED_DIRS" ]; then
            echo "No .tf changes detected since $LAST_TAG"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changed modules: $CHANGED_DIRS"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "dirs=$CHANGED_DIRS" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check_pr.outputs.pr_exists == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Checkout README generation scripts
        if: steps.check_pr.outputs.pr_exists == 'true'
        uses: actions/checkout@v6
        with:
          repository: nullplatform/actions-nullplatform
          path: .actions-scripts
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Generate READMEs
        if: steps.check_pr.outputs.pr_exists == 'true' && steps.changed.outputs.has_changes == 'true'
        run: |
          node .actions-scripts/.github/scripts/generate-readme-v2.js \
            ${{ steps.changed.outputs.dirs }} --verbose
        env:
          AI_PROVIDER: anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run terraform-docs
        if: steps.check_pr.outputs.pr_exists == 'true' && steps.changed.outputs.has_changes == 'true'
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          find-dir: .
          output-file: README.md
          config-file: ./.terraform-docs.yml
          output-method: inject
          git-push: "false"

      - name: Restore root README
        if: steps.check_pr.outputs.pr_exists == 'true'
        run: |
          git checkout HEAD -- README.md
          echo "Root README.md restored"

      - name: Update version references in READMEs
        if: steps.check_pr.outputs.pr_exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_TITLE=$(gh pr view ${{ steps.check_pr.outputs.pr_number }} \
            --repo ${{ github.repository }} \
            --json title --jq '.title')
          VERSION=$(echo "$PR_TITLE" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')

          if [ -z "$VERSION" ]; then
            echo "Could not extract version from PR title: $PR_TITLE"
            exit 1
          fi

          echo "Updating all READMEs to v$VERSION"
          find . -name "README.md" -not -path "*/.terraform/*" -not -path "./.actions-scripts/*" -not -path "./README.md" -type f | while read -r README; do
            if grep -q "ref=v[0-9]" "$README"; then
              sed -i "s/ref=v[0-9]*\.[0-9]*\.[0-9]*/ref=v$VERSION/g" "$README"
              echo "  Updated: $README"
            fi
          done

      - name: Fix git permissions
        if: steps.check_pr.outputs.pr_exists == 'true'
        run: sudo chown -R $(stat -c '%u:%g' .) .git

      - name: Commit and push
        if: steps.check_pr.outputs.pr_exists == 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git add -A '*.md' || true

          if git diff --staged --quiet; then
            echo "No README changes to commit"
          else
            if [ "${{ steps.changed.outputs.has_changes }}" = "true" ]; then
              git commit -m "docs: regenerate READMEs for changed modules and update versions"
            else
              git commit -m "docs: update version references in READMEs"
            fi
            git push origin release-please--branches--${{ github.ref_name }}
            echo "READMEs updated in Release PR #${{ steps.check_pr.outputs.pr_number }}"
          fi
        env:
          HUSKY: 0

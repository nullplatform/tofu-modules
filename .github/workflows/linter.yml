name: pipeline tofu
on:
  push:
    branches:
      - '**'
jobs:
  quality:
    uses: nullplatform/actions-nullplatform-terraform/.github/workflows/tofu-lint.yml@main
    if:  startsWith(github.ref_name, 'fix/') || startsWith(github.ref_name, 'feature/') || startsWith(github.head_ref || github.ref_name, 'hotfix/') || startsWith(github.ref_name, 'bugfix/') || startsWith(github.head_ref || github.ref_name, 'release-please--')

name: Tofu Unit Tests

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

jobs:
  # The lists below are written by hand. This fails when a module with tests is
  # missing from all of them.
  test-coverage:
    name: Every module with tests is listed
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: ./scripts/check-test-coverage.sh

  test-azure-modules:
    uses: nullplatform/actions-nullplatform/.github/workflows/tofu-test.yml@main
    with:
      modules: '["infrastructure/azure/resource_group", "infrastructure/azure/vnet", "infrastructure/azure/acr", "infrastructure/azure/acr_push_token", "infrastructure/azure/dns", "infrastructure/azure/private_dns", "infrastructure/azure/iam", "infrastructure/azure/aks"]'

  test-commons-modules:
    uses: nullplatform/actions-nullplatform/.github/workflows/tofu-test.yml@main
    with:
      modules: '["infrastructure/commons/cert_manager", "infrastructure/commons/external_dns", "infrastructure/commons/istio", "infrastructure/commons/prometheus"]'

  test-aws-modules:
    uses: nullplatform/actions-nullplatform/.github/workflows/tofu-test.yml@main
    with:
      modules: '["infrastructure/aws/vpc", "infrastructure/aws/acm", "infrastructure/aws/dns", "infrastructure/aws/aws_load_balancer_controller", "infrastructure/aws/ingress", "infrastructure/aws/iam/cert_manager", "infrastructure/aws/iam/external_dns", "infrastructure/aws/iam/agent", "infrastructure/aws/iam/aws_load_balancer_controller_iam", "infrastructure/aws/backend", "infrastructure/aws/iam/ci-build-workflow-role", "infrastructure/aws/iam/cloudwatch", "infrastructure/aws/iam/ecr"]'
      tofu_version: '1.11.4'

  test-gcp-modules:
    uses: nullplatform/actions-nullplatform/.github/workflows/tofu-test.yml@main
    with:
      modules: '["infrastructure/gcp/artifact-registry", "infrastructure/gcp/cloud-dns", "infrastructure/gcp/cloud-nat", "infrastructure/gcp/gke", "infrastructure/gcp/iam", "infrastructure/gcp/security", "infrastructure/gcp/vpc", "infrastructure/gcp/backend"]'

  test-nullplatform-modules:
    uses: nullplatform/actions-nullplatform/.github/workflows/tofu-test.yml@main
    with:
      modules: '["nullplatform/account", "nullplatform/agent", "nullplatform/api_key", "nullplatform/dimension", "nullplatform/dimension_value", "nullplatform/users", "nullplatform/metrics", "nullplatform/asset/docker_server", "nullplatform/asset/ecr", "nullplatform/cloud/azure/cloud", "nullplatform/cloud/gcp/cloud", "nullplatform/cloud/aws/cloud", "nullplatform/code_repository", "nullplatform/base", "nullplatform/scope_configuration", "nullplatform/parameter_storage_configuration", "nullplatform/scope_definition_agent_association", "nullplatform/service_definition_agent_association", "nullplatform/parameter_storage_definition_agent_association", "nullplatform/package_installation", "nullplatform/service_package_installation", "nullplatform/scope_package_installation", "nullplatform/identity-access-control", "nullplatform/service_definition"]'

  # Kept apart from the group above: these tests call functions in a variables
  # block, which OpenTofu accepts from 1.11.
  test-nullplatform-modules-tofu-1-11:
    uses: nullplatform/actions-nullplatform/.github/workflows/tofu-test.yml@main
    with:
      modules: '["nullplatform/packaged_service"]'
      tofu_version: '1.11.4'

  # Not the shared workflow: these tests render templates with gomplate, which the
  # runner does not ship and the shared workflow has no step to install.
  test-nullplatform-modules-gomplate:
    name: "Test ${{ matrix.module }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module: ["nullplatform/scope_definition"]
    env:
      GOMPLATE_VERSION: v4.3.3
      GOMPLATE_SHA256: ca281666e86f2f09218c1653e1908f572c0e349e9de64cb4ea93ade9333f0596
    steps:
      - uses: actions/checkout@v6

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: '1.10.6'

      - name: Install gomplate
        run: |
          curl -fsSL -o gomplate "https://github.com/hairyhenderson/gomplate/releases/download/${GOMPLATE_VERSION}/gomplate_linux-amd64"
          echo "${GOMPLATE_SHA256}  gomplate" | sha256sum -c -
          sudo install -m 0755 gomplate /usr/local/bin/gomplate
          rm gomplate

      - name: Run tofu init
        working-directory: ${{ matrix.module }}
        run: tofu init -backend=false

      - name: Run tofu test
        working-directory: ${{ matrix.module }}
        run: tofu test

  test-container-orchestration-modules:
    uses: nullplatform/actions-nullplatform/.github/workflows/tofu-test.yml@main
    with:
      modules: '["nullplatform/container_orchestration/aks", "nullplatform/container_orchestration/eks", "nullplatform/container_orchestration/gke", "nullplatform/container_orchestration/oke"]'

  test-gate:
    name: All module tests passed
    runs-on: ubuntu-24.04
    needs: [test-coverage, test-azure-modules, test-commons-modules, test-aws-modules, test-gcp-modules, test-nullplatform-modules, test-nullplatform-modules-tofu-1-11, test-nullplatform-modules-gomplate, test-container-orchestration-modules]
    if: always()
    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.test-coverage.result }}" != "success" || "${{ needs.test-azure-modules.result }}" != "success" || "${{ needs.test-commons-modules.result }}" != "success" || "${{ needs.test-aws-modules.result }}" != "success" || "${{ needs.test-gcp-modules.result }}" != "success" || "${{ needs.test-nullplatform-modules.result }}" != "success" || "${{ needs.test-nullplatform-modules-tofu-1-11.result }}" != "success" || "${{ needs.test-nullplatform-modules-gomplate.result }}" != "success" || "${{ needs.test-container-orchestration-modules.result }}" != "success" ]]; then
            echo "One or more test jobs failed"
            exit 1
          fi
